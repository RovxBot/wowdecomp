name: M3 native packet prerequisites
on:
  workflow_dispatch:
  push:
    branches: [main, 'native-port/**']
    paths:
      - '.github/workflows/m3-packets.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/Source/PortableCore/**'
      - 'Engine/Source/PortablePackets/**'
      - 'Engine/Source/Base/**'
      - 'Engine/Source/Storm/**'
      - 'Engine/Source/Os/**'
      - 'Engine/Source/BlizzardCore/**'
      - 'WoW/Source/WowServices/HMAC.h'
      - 'Tools/NativeNet/**'
      - 'Tools/Porting/**'
  pull_request:
    paths:
      - '.github/workflows/m3-packets.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/Source/PortableCore/**'
      - 'Engine/Source/PortablePackets/**'
      - 'Engine/Source/Base/**'
      - 'Engine/Source/Storm/**'
      - 'Engine/Source/Os/**'
      - 'Engine/Source/BlizzardCore/**'
      - 'WoW/Source/WowServices/HMAC.h'
      - 'Tools/NativeNet/**'
      - 'Tools/Porting/**'
permissions:
  contents: read
concurrency:
  group: m3-packets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: linux-packets
            python: python3
          - runner: ubuntu-24.04
            preset: linux-packets-asan
            python: python3
          - runner: macos-14
            preset: macos-arm64-packets
            python: python3
          - runner: windows-2022
            preset: windows-packets
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source-selection and graph-audit fixtures
        run: ${{ matrix.python }} -m unittest discover -s Tools/Porting -p 'test_*.py' -v
      - name: Compile and check native packet prerequisites
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ${{ matrix.python }} Tools/Porting/run_packet_checks.py --preset ${{ matrix.preset }}
      - name: Retain packet qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3-${{ matrix.preset }}-${{ github.sha }}
          path: artifacts/${{ matrix.preset }}/
          if-no-files-found: error
          retention-days: 14
