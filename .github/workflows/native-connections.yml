name: Original native connections
on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/Source/PortableCore/**'
      - 'Engine/Source/PortablePackets/**'
      - 'Engine/Source/PortableNet/**'
      - 'Engine/Source/Os/**'
      - 'Engine/Source/Base/**'
      - 'Engine/Source/Storm/**'
      - 'Engine/Source/BlizzardCore/**'
      - 'WoW/Source/WowServices/**'
      - 'Tools/NativeNet/**'
      - 'Tools/Porting/**'
      - '.github/workflows/native-connections.yml'
  push:
    branches: [main]
    paths: *paths
permissions:
  contents: read
concurrency:
  group: native-connections-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connections:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: linux-connections
          - runner: ubuntu-24.04
            preset: linux-connections-asan
          - runner: macos-15
            preset: macos-arm64-connections
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Source and policy checks
        run: python3 -m unittest discover -s Tools/Porting -p 'test_*.py' -v
      - name: Compile original connections and execute loopback contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: python3 Tools/Porting/run_connection_checks.py --preset ${{ matrix.preset }}
      - name: Preserve source, binary identities and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.preset }}-${{ github.sha }}
          path: artifacts/${{ matrix.preset }}/
          if-no-files-found: error
          retention-days: 14
