name: Full Linux x64 application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Tools/LinuxClient/**'
      - 'Tools/NativeD3D9/package.py'
      - '.github/workflows/linux-x64.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/LinuxClient/**'
      - 'Tools/NativeD3D9/package.py'
      - '.github/workflows/linux-x64.yml'

permissions:
  contents: read
concurrency:
  group: full-linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, test-server]
        strict: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install full Linux client and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libsdl3-dev libwayland-dev libcurl4-openssl-dev libasound2-dev libvulkan-dev libxvidcore-dev squashfs-tools
      - name: Source and launcher regression checks
        run: python3 -B -m unittest discover -s Tools/LinuxClient -p 'test_*.py'
      - name: Build complete client, execute contracts and package application
        env:
          FULL_STRICT: ${{ matrix.strict }}
          FULL_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FULL_STRICT" = true ]; then args+=(--strict); fi
          if [ "$FULL_PROFILE" = test-server ]; then args+=(--test-server); fi
          python3 -B Tools/LinuxClient/build.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/full-linux-build.log"
      - name: Retain the single application and checksum
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-${{ matrix.profile }}-${{ matrix.strict && 'strict' || 'release' }}-${{ github.sha }}
          path: artifacts/full-linux/${{ matrix.profile }}-${{ matrix.strict && 'strict' || 'release' }}/WoW-*.AppImage*
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed application for diagnosis only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-diagnostic-${{ matrix.profile }}-${{ matrix.strict && 'strict' || 'release' }}-${{ github.sha }}
          path: artifacts/full-linux/${{ matrix.profile }}-${{ matrix.strict && 'strict' || 'release' }}/WoW-*.AppImage*
          if-no-files-found: ignore
          retention-days: 14
      - name: Stage build log including failures
        if: always()
        run: |
          mkdir -p artifacts/full-linux/evidence
          if [ -f "$RUNNER_TEMP/full-linux-build.log" ]; then cp "$RUNNER_TEMP/full-linux-build.log" artifacts/full-linux/evidence/build.log; fi
      - name: Retain exact source, manifests and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-linux-evidence-${{ matrix.profile }}-${{ matrix.strict && 'strict' || 'release' }}-${{ github.sha }}
          path: |
            artifacts/full-linux/**/manifest.json
            artifacts/full-linux/**/source-audit.json
            artifacts/full-linux/**/adapted-source.tar.gz
            artifacts/full-linux/**/CMakeCache.txt
            artifacts/full-linux/**/build.log
          if-no-files-found: error
          retention-days: 14
