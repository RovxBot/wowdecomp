name: M0 Windows baseline

on:
  workflow_dispatch:
  push:
    branches: [main, 'native-port/**']
    paths:
      - '.github/workflows/windows-baseline.yml'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/**'
      - 'WoW/**'
      - 'ThirdParty/**'
      - 'Tools/**'
      - 'waystone.rc'
      - 'waystone.ico'
  pull_request:
    paths:
      - '.github/workflows/windows-baseline.yml'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/**'
      - 'WoW/**'
      - 'ThirdParty/**'
      - 'Tools/**'
      - 'waystone.rc'
      - 'waystone.ico'

permissions:
  contents: read

concurrency:
  group: windows-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure and build the Windows x64 reference
        shell: pwsh
        run: ./Tools/Porting/Build-WindowsBaseline.ps1
      - name: Preserve build evidence and client artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-baseline-${{ github.sha }}
          path: artifacts/windows-baseline/
          if-no-files-found: error
          retention-days: 14
