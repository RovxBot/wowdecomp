name: M3 Linux OpenGL context

on:
  workflow_dispatch:
  push:
    branches: [main, 'native-port/**']
    paths:
      - '.github/workflows/m3-gl.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/Source/PortableCore/**'
      - 'Engine/Source/PortableFiles/**'
      - 'Engine/Source/PortableAssets/**'
      - 'Engine/Source/PortableAsync/**'
      - 'Engine/Source/PortableWindow/**'
      - 'Engine/Source/PortableGx/**'
      - 'Engine/Source/PortableFrameFonts/**'
      - 'Engine/Source/PortableLua/**'
      - 'Engine/Source/PortableFrameScript/**'
      - 'Engine/Source/PortableXML/**'
      - 'Engine/Source/PortableLayout/**'
      - 'Engine/Source/Frame/**'
      - 'Engine/Source/FrameScript/**'
      - 'Engine/Source/FrameXML/**'
      - 'Engine/Source/lua-5.1/**'
      - 'Tools/NativeFrameFonts/**'
      - 'Tools/NativeFrameRender/**'
      - 'Tools/NativeLua/**'
      - 'Tools/NativeFrameScript/**'
      - 'Tools/NativeXML/**'
      - 'Tools/NativeLayout/**'
      - 'Engine/Source/Gx/**'
      - 'Engine/Source/Gxu/**'
      - 'Engine/Source/Base/**'
      - 'Engine/Source/Tempest/**'
      - 'Engine/Source/Services/TextBlock.*'
      - 'Engine/Source/Services/Texture.h'
      - 'Tools/NativeGx/**'
      - 'Engine/Source/Event/Types.h'
      - 'Tools/PortableWindow/**'
      - 'Tools/NativeShell/**'
      - 'Engine/Source/Services/Portable/**'
      - 'Tools/PortableAsync/**'
      - 'ThirdParty/**'
      - 'Tools/PortableAssets/**'
      - 'Tools/NativeAssets/**'
      - 'Engine/Source/Os/**'
      - 'Engine/Source/Storm/**'
      - 'Engine/Source/BlizzardCore/**'
      - 'Tools/PortableFiles/**'
      - 'Tools/PortableCore/**'
      - 'Tools/NativeCore/**'
      - 'Tools/Porting/**'
  pull_request:
    paths:
      - '.github/workflows/m3-gl.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'Engine/Source/PortableCore/**'
      - 'Engine/Source/PortableFiles/**'
      - 'Engine/Source/PortableAssets/**'
      - 'Engine/Source/PortableAsync/**'
      - 'Engine/Source/PortableWindow/**'
      - 'Engine/Source/PortableGx/**'
      - 'Engine/Source/PortableFrameFonts/**'
      - 'Engine/Source/PortableLua/**'
      - 'Engine/Source/PortableFrameScript/**'
      - 'Engine/Source/PortableXML/**'
      - 'Engine/Source/PortableLayout/**'
      - 'Engine/Source/Frame/**'
      - 'Engine/Source/FrameScript/**'
      - 'Engine/Source/FrameXML/**'
      - 'Engine/Source/lua-5.1/**'
      - 'Tools/NativeFrameFonts/**'
      - 'Tools/NativeFrameRender/**'
      - 'Tools/NativeLua/**'
      - 'Tools/NativeFrameScript/**'
      - 'Tools/NativeXML/**'
      - 'Tools/NativeLayout/**'
      - 'Engine/Source/Gx/**'
      - 'Engine/Source/Gxu/**'
      - 'Engine/Source/Base/**'
      - 'Engine/Source/Tempest/**'
      - 'Engine/Source/Services/TextBlock.*'
      - 'Engine/Source/Services/Texture.h'
      - 'Tools/NativeGx/**'
      - 'Engine/Source/Event/Types.h'
      - 'Tools/PortableWindow/**'
      - 'Tools/NativeShell/**'
      - 'Engine/Source/Services/Portable/**'
      - 'Tools/PortableAsync/**'
      - 'ThirdParty/**'
      - 'Tools/PortableAssets/**'
      - 'Tools/NativeAssets/**'
      - 'Engine/Source/Os/**'
      - 'Engine/Source/Storm/**'
      - 'Engine/Source/BlizzardCore/**'
      - 'Tools/PortableFiles/**'
      - 'Tools/PortableCore/**'
      - 'Tools/NativeCore/**'
      - 'Tools/Porting/**'

permissions:
  contents: read

concurrency:
  group: m3-gl-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: linux-gl
            python: python3
          - runner: ubuntu-24.04
            preset: linux-gl-asan
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux window-system development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev libegl-dev libgles-dev libgbm-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libgl-dev libgl1-mesa-dri mesa-utils xvfb xauth
      - name: Check source-selection and graph-audit fixtures
        run: ${{ matrix.python }} -m unittest discover -s Tools/Porting -p 'test_*.py' -v
      - name: Compile and test native OpenGL on hosted X11/Mesa
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" ${{ matrix.python }} Tools/Porting/run_core_checks.py --preset ${{ matrix.preset }}
      # The preceding strict check still fails the workflow. Recovery here only
      # gathers additional UBSan findings from that same binary; never qualifies it.
      - name: Collect unqualified font recovery diagnostics after failure
        if: failure() && matrix.preset == 'linux-gl-asan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=1
        run: |
          if test -x build/linux-gl-asan/bin/NativeFontsCheck; then
            build/linux-gl-asan/bin/NativeFontsCheck Tools/NativeGx/fonts/tiny.ttf 2>&1 | tee artifacts/linux-gl-asan/font-recovery-diagnostics.log
          fi
      - name: Preserve OpenGL context evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3-${{ matrix.preset }}-${{ github.sha }}
          path: artifacts/${{ matrix.preset }}/
          if-no-files-found: error
          retention-days: 14
