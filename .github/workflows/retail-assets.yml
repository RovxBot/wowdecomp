name: Offline retail asset tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Tools/RetailAssets/**'
      - '.github/workflows/retail-assets.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/RetailAssets/**'
      - '.github/workflows/retail-assets.yml'

permissions:
  contents: read
concurrency:
  group: retail-assets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install reader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ zlib1g-dev
      - name: Validate asset tooling without game data
        run: python3 -B -m unittest discover -s Tools/RetailAssets -p 'test_*.py' -v
      - name: Compile pinned optional reader without game data
        run: python3 -B Tools/RetailAssets/build_reader.py
      - name: Retain reader and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-casc-reader-${{ github.sha }}
          path: artifacts/retail-asset-reader/
          if-no-files-found: error
          retention-days: 30
